name: EVPN_test

topology:
  nodes:

    leaf1:
      kind: linux
      image: frrouting/frr:latest

      binds:
        - leaf1/config.sh:/config.sh
      exec:
        - chmod +x /config.sh
        - ./config.sh
      exec:
    leaf2:
      kind: linux
      image: frrouting/frr:latest
      
      binds:
        - leaf2/config.sh:/config.sh
      exec:
        - chmod +x /config.sh
        - ./config.sh
    spine1:
      kind: linux
      image: frrouting/frr:latest

      binds:
        - spine1/config.sh:/config.sh
      exec:
        - chmod +x /config.sh
        - ./config.sh
    spine2:
      kind: linux
      image: frrouting/frr:latest

      binds:
        - spine2/config.sh:/config.sh
      exec:
        - chmod +x /config.sh
        - ./config.sh
    host1:
      kind: linux
      image: apline:latest

      binds:
        - host1/config.sh:/config.sh
      exec:
        - chmod +x /config.sh
        - ./config.sh
    host2:
      kind: linux
      image: alpine:latest
      binds:
        - host2/config.sh:/config.sh
      exec:
        - chmod +x /config.sh
        - ./config.sh
  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["leaf1:eth67", "host1:eth1"]
    - endpoints: ["leaf2:eth67", "host2:eth1"]
