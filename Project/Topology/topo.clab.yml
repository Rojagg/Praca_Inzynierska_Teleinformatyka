name: EVPN_test

topology:
  nodes:

    leaf1:
      kind: linux
      image: frrouting/frr:latest


      binds:
        - ../Leaf1/config.sh:/config.sh
        - ../group_files/daemons:/etc/frr/daemons
      exec:
        - chmod +x /config.sh
        - ./config.sh
    leaf2:
      kind: linux
      image: frrouting/frr:latest
      
      binds:
        - ../Leaf2/config.sh:/config.sh
        - ../group_files/daemons:/etc/frr/daemons
      exec:
        - chmod +x /config.sh
        - ./config.sh
    spine1:
      kind: linux
      image: frrouting/frr:latest

      binds:
        - ../Spine1/config.sh:/config.sh
        - ../group_files/daemons:/etc/frr/daemons
      exec:
        - chmod +x /config.sh
        - ./config.sh
    spine2:
      kind: linux
      image: frrouting/frr:latest

      binds:
        - ../Spine2/config.sh:/config.sh
        - ../group_files/daemons:/etc/frr/daemons
      exec:
        - chmod +x /config.sh
        - ./config.sh
    host1:
      kind: linux
      image: alpine:latest

      binds:
        - ../Host1/config.sh:/config.sh
      exec:
        - chmod +x /config.sh
        - ./config.sh
    host2:
      kind: linux
      image: alpine:latest
      binds:
        - ../Host2/config.sh:/config.sh
      exec:
        - chmod +x /config.sh
        - ./config.sh
  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["leaf1:eth67", "host1:eth1"]
    - endpoints: ["leaf2:eth67", "host2:eth1"]
