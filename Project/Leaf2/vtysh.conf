##
#	Configuration of OSPF
##

router ospf
 ospf router-id 100.64.0.2
 network 192.168.12.1/32 area 0
 network 192.168.22.1/32 area 0
 network 100.64.0.2/32 area 0

##
#	Configuration of VRF
##

vrf vrf1
 vni 100
exit-vrf

vrf vrf2
 vni 200
exit-vrf

##
#	Configuration of BGP
##

router bgp 65000
 bgp router-id 100.64.0.2
 neighbor 10.0.2.1 remote-as 65000
 neighbor 10.0.2.1 update-source lo
 neighbor 10.0.2.2 remote-as 65000
 neighbor 10.0.2.2 update-source lo
 address-family l2vpn evpn
  neighbor 10.0.2.1 activate
  neighbor 10.0.2.2 activate
  advertise-all-vni
  advertise-svi-ip

##
#	Configuration of BGP for instances
##

router bgp 65000 vrf vrf1

 address-family ipv4 unicast
  redistribute connected
 exit-address-family

 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family


router bgp 65000 vrf vrf2

 address-family ipv4 unicast
  redistribute connected
 exit-address-family

 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
exit
